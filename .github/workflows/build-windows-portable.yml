name: Build PisoTab Windows Portable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Download bundled Node runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $url = 'https://nodejs.org/dist/v22.23.2/node-v22.23.2-win-x64.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'node22.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'node22'

          Invoke-WebRequest $url -OutFile $zip
          Expand-Archive $zip $dir -Force

          New-Item -ItemType Directory -Force runtime | Out-Null

          Copy-Item `
            "$dir\node-v22.23.2-win-x64\node.exe" `
            "runtime\node.exe" `
            -Force

          & "runtime\node.exe" --version

      - name: Install server dependencies
        working-directory: server
        run: npm install --omit=dev

      - name: Verify server dependencies
        working-directory: server
        run: |
          node -e "require('express'); require('ws'); require('better-sqlite3'); console.log('SERVER DEPENDENCIES OK')"

      - name: Copy server into app bundle
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          if (Test-Path "app\bundle-server") {
            Remove-Item "app\bundle-server" -Recurse -Force
          }

          New-Item -ItemType Directory -Force "app\bundle-server" | Out-Null

          Copy-Item "server\server.js" "app\bundle-server\server.js"
          Copy-Item "server\config.json" "app\bundle-server\config.json"
          Copy-Item "server\package.json" "app\bundle-server\package.json"

          Copy-Item `
            "server\node_modules" `
            "app\bundle-server\node_modules" `
            -Recurse `
            -Force

          Write-Host "Checking Express:"
          if (!(Test-Path "app\bundle-server\node_modules\express")) {
            throw "Express was not copied!"
          }

          Write-Host "Checking better-sqlite3:"
          if (!(Test-Path "app\bundle-server\node_modules\better-sqlite3")) {
            throw "better-sqlite3 was not copied!"
          }

          Write-Host "SERVER BUNDLE OK"

      - name: Install Electron
        working-directory: app
        run: npm install

      - name: Build portable EXE
        working-directory: app
        run: npm run build

      - name: Verify EXE
        shell: powershell
        run: |
          $exe = "app\dist\PisoTab-Portable-0.6.0.exe"

          if (!(Test-Path $exe)) {
            throw "PisoTab EXE was not created."
          }

          Write-Host "BUILD SUCCESS"
          Get-Item $exe

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: PisoTab-Portable-v0.6.0
          path: app/dist/PisoTab-Portable-0.6.0.exe
          if-no-files-found: error
